server:
  port: 8084

spring:
  application:
    name: bet-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/betflow_users
    username: betflow
    password: betflow_dev
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: bet-service
      auto-offset-reset: earliest

management:
  endpoints:
    web:
      exposure:
        include: health,info