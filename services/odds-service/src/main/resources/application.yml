server:
  port: 8083

spring:
  application:
    name: odds-service
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      password: betflow_dev

  datasource:
    url: jdbc:postgresql://localhost:5432/betflow_users
    username: betflow
    password: betflow_dev

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

odds:
  api:
    key: 2579fef4b4bedb73607f4b44b461eb66
    base-url: https://api.the-odds-api.com/v4
  poll:
    interval-ms: 300000

resilience4j:
  circuitbreaker:
    instances:
      oddsApi:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
