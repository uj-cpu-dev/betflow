server:
  port: 8082

spring:
  application:
    name: auth-service
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/betflow_users   # ← changed, users table is here
    username: betflow
    password: betflow_dev

  jpa:
